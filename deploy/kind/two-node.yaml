# 測試用的 kind cluster：兩個節點。
#
# 放在 deploy/kind/ 而不是 deploy/k8s/，因為後者只放可以直接 kubectl apply 的
# manifest —— CI 會對那個目錄下每個檔案做 server-side dry-run，而 kind 的
# Cluster 不是 Kubernetes 資源。
#
# 為什麼一定要兩個節點：internal/podzone 的 informer 以 spec.nodeName 過濾，
# 只看本機節點的 pod。單節點的 cluster 無法證明那個範圍限縮真的生效 —— 所有
# pod 本來就都在同一個節點上。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
