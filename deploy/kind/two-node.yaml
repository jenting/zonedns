# A kind cluster for testing: two nodes.
#
# It lives in deploy/kind/ rather than deploy/k8s/, because the latter holds only
# manifests that can be applied with kubectl — CI runs a server-side dry-run over
# every file in that directory, and a kind Cluster is not a Kubernetes resource.
#
# Why two nodes are required: internal/podzone's informer filters by
# spec.nodeName and sees only this node's pods. A single-node cluster cannot
# prove that scoping takes effect — every pod is on the one node regardless.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
