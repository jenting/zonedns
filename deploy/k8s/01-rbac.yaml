# node-local-dns needs to read the pods on its own node in order to map a query's
# source IP to the asking workload's zone label. Upstream's node-local-dns
# ServiceAccount holds no permissions at all, so this RBAC is added by this
# solution.
#
# The permissions deliberately stop at read-only access to pods. The informer
# filters by spec.nodeName and in practice sees only the few dozen pods on this
# node — but Kubernetes RBAC cannot scope list/watch to a single node, so what is
# granted is cluster-wide read access to pods. That is worth putting in front of a
# security review before adoption.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    k8s-app: node-local-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-local-dns
  labels:
    k8s-app: node-local-dns
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-local-dns
  labels:
    k8s-app: node-local-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-local-dns
subjects:
  - kind: ServiceAccount
    name: node-local-dns
    namespace: kube-system
