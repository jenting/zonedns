# node-local-dns's Corefile.
#
# It adds exactly one thing to upstream's: a server block dedicated to the
# zone-routed domain. The existing cluster.local, in-addr.arpa, ip6.arpa and
# default forward follow upstream exactly, and their behaviour is unchanged.
#
# Why a separate block (spec §7.4): node-local-dns's built-in cache plugin keys on
# (qname, qtype) and does not include the asking workload's zone. Were it to cache
# zone-routed names, then once a zone-a pod had asked, a zone-b pod would receive
# that same answer — convincingly, with no sign of it at runtime. Confining
# zonedns_agent to its own block gives it its own zone-aware cache and leaves every
# other line of the configuration untouched.
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    addonmanager.kubernetes.io/mode: Reconcile
data:
  Corefile: |
    # ── added by zonedns ───────────────────────────────────────────────────
    # Replace example.com with the domain your VirtualService hosts actually use.
    # Only queries landing in this block take the zone-routed path.
    example.com:53 {
        errors
        reload
        loop
        bind __PILLAR__LOCAL__DNS__ __PILLAR__DNS__SERVER__
        zonedns_agent {
            mode              k8s
            node_name         {$NODE_NAME}
            zone_label        zone
            # No path: the DoH library appends /dns-query itself, so writing it
            # here produces /dns-query/dns-query and an HTTP 404. A value carrying
            # a path is refused at startup.
            upstream          https://zonedns-central.example.org:8443
            central_spiffe_id spiffe://example.org/zone/mgmt/service/zonedns-central
            workload_api      unix:///run/spire/sockets/agent.sock
            cache_size        4096
            edns0_code        65001
        }
        prometheus :9253
        }
    # ── end of the zonedns addition ────────────────────────────────────────
    __PILLAR__DNS__DOMAIN__:53 {
        errors
        cache {
                success 9984 30
                denial 9984 5
        }
        reload
        loop
        bind __PILLAR__LOCAL__DNS__ __PILLAR__DNS__SERVER__
        forward . __PILLAR__CLUSTER__DNS__ {
                force_tcp
        }
        prometheus :9253
        health __PILLAR__LOCAL__DNS__:8080
        }
    in-addr.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind __PILLAR__LOCAL__DNS__ __PILLAR__DNS__SERVER__
        forward . __PILLAR__CLUSTER__DNS__ {
                force_tcp
        }
        prometheus :9253
        }
    ip6.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind __PILLAR__LOCAL__DNS__ __PILLAR__DNS__SERVER__
        forward . __PILLAR__CLUSTER__DNS__ {
                force_tcp
        }
        prometheus :9253
        }
    .:53 {
        errors
        cache 30
        reload
        loop
        bind __PILLAR__LOCAL__DNS__ __PILLAR__DNS__SERVER__
        forward . __PILLAR__UPSTREAM__SERVERS__
        prometheus :9253
        }
