# 兩份 ClusterSPIFFEID，用途完全不同。
#
# 第一份決定 central 的 registry 內容：它產生的 registration entry 裡，
# dns_names 提供「client 會查的名字」，spiffe_id 的 path 提供 zone。central
# 輪詢 SPIRE Entry API 拿到的就是這些。
#
# 第二份讓 node-local-dns 自己拿得到 SVID，才能跟 central 建立 mTLS。
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: zonedns-workloads
spec:
  # 這道守衛是必要條件，不是最佳化。
  #
  # spire-controller-manager 渲染模板時沒有設 missingkey=error，label 不存在會
  # 渲染成空字串；而 SPIRE Server 的 x509util.ValidateLabel 會以 ErrEmptyDomain
  # 拒絕空的 DNS name，導致整筆 registration entry 建立失敗 —— 那個 pod 會拿不到
  # SVID，失效範圍遠大於 DNS。
  podSelector:
    matchExpressions:
      - {key: zonedns.io/host, operator: Exists}
  # zone 從 pod 的 zone label 來。這是整個系統唯一宣告 zone 的地方：同一個值
  # 同時決定這個 workload 當 client 時的 source zone，與它當 server 時 registry
  # 查到的 dest zone，兩者由建構方式保證一致。
  spiffeIDTemplate: 'spiffe://example.org/zone/{{ .PodMeta.Labels.zone }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}'
  # 一個 workload 只能有一個對外 FQDN（spec §9 已知限制 1）。加第二個選配 label
  # 會在未填時渲染出空字串導致 entry 被拒；開第二個 ClusterSPIFFEID 會因 SPIFFE ID
  # 與 selector 相同而被 entriesMasked 遮蔽。
  dnsNameTemplates:
    - '{{ index .PodMeta.Labels "zonedns.io/host" }}'
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: zonedns-node-local-dns
spec:
  podSelector:
    matchLabels:
      k8s-app: node-local-dns
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system
  # 這個 SPIFFE ID 必須逐字出現在 central Corefile 的 authorized_agent 清單裡，
  # 否則 central 會忽略這個節點宣告的 zone，並靜默退回非 zone-aware 路徑 ——
  # 查詢照常有答案，只是不再分 zone。兩端的設定必須成對維護。
  spiffeIDTemplate: 'spiffe://example.org/zone/infra/node/{{ .NodeMeta.Name }}'
