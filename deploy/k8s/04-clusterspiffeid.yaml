# Two ClusterSPIFFEIDs, serving entirely different purposes.
#
# The first determines the contents of central's registry: in the registration
# entries it produces, dns_names supply the names clients will query and the
# spiffe_id path supplies the zone. This is what central retrieves when it polls
# the SPIRE Entry API.
#
# The second lets node-local-dns obtain an SVID of its own, so it can establish
# mTLS with central.
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: zonedns-workloads
spec:
  # This guard is a requirement, not an optimisation.
  #
  # spire-controller-manager renders templates without missingkey=error, so a
  # missing label renders as the empty string; and SPIRE Server's
  # x509util.ValidateLabel refuses an empty DNS name with ErrEmptyDomain, which
  # fails creation of the whole registration entry — that pod would get no SVID at
  # all, and the damage would reach far beyond DNS.
  podSelector:
    matchExpressions:
      - {key: zonedns.io/host, operator: Exists}
  # The zone comes from the pod's zone label. This is the only place in the whole
  # system where a zone is declared: one value settles both this workload's source
  # zone when it acts as a client and the dest zone the registry reports when it
  # acts as a server, and the two agree by construction.
  spiffeIDTemplate: 'spiffe://example.org/zone/{{ .PodMeta.Labels.zone }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}'
  # A workload may have exactly one external FQDN (spec §9, known limitation 1).
  # Adding a second optional label renders the empty string when it is unset and
  # the entry is refused; a second ClusterSPIFFEID is masked by entriesMasked
  # because its SPIFFE ID and selector are identical.
  dnsNameTemplates:
    - '{{ index .PodMeta.Labels "zonedns.io/host" }}'
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: zonedns-node-local-dns
spec:
  podSelector:
    matchLabels:
      k8s-app: node-local-dns
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system
  # This SPIFFE ID must appear verbatim in the authorized_agent list of central's
  # Corefile, or central ignores the zone this node declares and falls back
  # silently to the non-zone-aware path — queries still return answers, they just
  # stop distinguishing zones. The two ends' configurations must be maintained as
  # a pair.
  spiffeIDTemplate: 'spiffe://example.org/zone/infra/node/{{ .NodeMeta.Name }}'
