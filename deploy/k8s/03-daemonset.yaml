# The node-local-dns DaemonSet, with zonedns_agent inside it.
#
# The structure follows upstream kubernetes/kubernetes's
# cluster/addons/dns/nodelocaldns exactly, with three differences (see "Changes to
# the DaemonSet" in the deployment doc):
#   1. the image points at the self-built version (upstream's image has no
#      zonedns_agent, since plugins are linked at compile time)
#   2. serviceAccountName is bound to an SA with read access to pods (see
#      01-rbac.yaml)
#   3. two extra mounts and two extra environment variables: SPIRE's Workload API
#      socket, and the node's own name and address
#
# Present upstream already, and none of it optional: hostNetwork,
# dnsPolicy: Default, priorityClassName, both -localip addresses, the xtables-lock
# mount, NET_ADMIN, and tolerations covering every taint. Drop any one of them and
# node-local-dns itself stops working — none of that concerns zone routing, it is
# what managing the dummy interface and the iptables rules requires.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    k8s-app: node-local-dns
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: Reconcile
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 10%
  selector:
    matchLabels:
      k8s-app: node-local-dns
  template:
    metadata:
      labels:
        k8s-app: node-local-dns
      annotations:
        prometheus.io/port: "9253"
        prometheus.io/scrape: "true"
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: node-local-dns
      hostNetwork: true
      dnsPolicy: Default  # Don't use cluster DNS.
      tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
      - effect: "NoExecute"
        operator: "Exists"
      - effect: "NoSchedule"
        operator: "Exists"
      containers:
      - name: node-cache
        # Must be changed: the self-built image. Upstream's k8s-dns-node-cache
        # does not contain zonedns_agent.
        image: REGISTRY/k8s-dns-node-cache-zonedns:TAG
        resources:
          requests:
            cpu: 25m
            # Upstream uses 5Mi. client-go's informer needs more room for its cache
            # of local pods; 25Mi is conservative — adjust it to the pod count your
            # nodes actually carry.
            memory: 25Mi
        args: [ "-localip", "__PILLAR__LOCAL__DNS__,__PILLAR__DNS__SERVER__", "-conf", "/etc/Corefile", "-upstreamsvc", "kube-dns-upstream" ]
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        env:
        # zonedns_agent filters the informer by node_name so it sees only this
        # node's pods.
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # The node's own address, used to detect masquerading: a query whose source
        # IP equals the node IP leaves no way to tell which workload is asking. A
        # malformed value fails plugin startup rather than being ignored silently —
        # it is the sole basis for that signal.
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        ports:
        - containerPort: 53
          name: dns
          protocol: UDP
        - containerPort: 53
          name: dns-tcp
          protocol: TCP
        - containerPort: 9253
          name: metrics
          protocol: TCP
        livenessProbe:
          httpGet:
            host: __PILLAR__LOCAL__DNS__
            path: /health
            port: 8080
          initialDelaySeconds: 60
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /run/xtables.lock
          name: xtables-lock
          readOnly: false
        - name: config-volume
          mountPath: /etc/coredns
        - name: kube-dns-config
          mountPath: /etc/kube-dns
        # SPIRE's Workload API: the agent obtains its own SVID through it to
        # establish mTLS with central.
        - name: spire-agent-socket
          mountPath: /run/spire/sockets
          readOnly: true
      volumes:
      - name: xtables-lock
        hostPath:
          path: /run/xtables.lock
          type: FileOrCreate
      - name: kube-dns-config
        configMap:
          name: kube-dns
          optional: true
      - name: config-volume
        configMap:
          name: node-local-dns
          items:
            - key: Corefile
              path: Corefile.base
      # Must be confirmed: the path at which the SPIRE agent actually exposes its
      # socket on your nodes. The value here is SPIFFE's conventional one; a SPIRE
      # installed by Helm chart may differ. A wrong path makes the plugin fail at
      # startup on a timeout that names workload_api, rather than degrading
      # silently.
      - name: spire-agent-socket
        hostPath:
          path: /run/spire/sockets
          type: Directory
---
# A headless service so Prometheus can scrape each node's metrics. As upstream.
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: "9253"
    prometheus.io/scrape: "true"
  labels:
    k8s-app: node-local-dns
  name: node-local-dns
  namespace: kube-system
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9253
      targetPort: 9253
  selector:
    k8s-app: node-local-dns
