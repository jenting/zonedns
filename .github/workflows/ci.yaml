name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # In step with go.mod's go directive. This version is not arbitrary: it must
  # match upstream sigs.k8s.io/node-local-dns, or the agent plugin will not link.
  GO_VERSION: "1.25"

jobs:
  test:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "the following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go mod tidy should be a no-op
        run: |
          cp go.mod /tmp/go.mod.orig
          cp go.sum /tmp/go.sum.orig
          go mod tidy
          if ! diff -q go.mod /tmp/go.mod.orig >/dev/null || ! diff -q go.sum /tmp/go.sum.orig >/dev/null; then
            echo "go mod tidy produced a diff; run it locally and commit the result:"
            diff go.mod /tmp/go.mod.orig || true
            exit 1
          fi

      - name: go test
        run: go test ./... -race -cover

  plugin-link:
    name: Links into CoreDNS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zonedns
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # What this job verifies is entirely out of go test ./...'s reach: a module
      # that compiles on its own does not mean CoreDNS's plugin.cfg can link it in.
      # A new import, a version conflict, or a change in how the plugin registers
      # itself will fail here and nowhere else.
      - name: Fetch CoreDNS (version in step with go.mod)
        run: |
          version=$(grep -oE 'github.com/coredns/coredns v[0-9.]+' zonedns/go.mod | head -1 | awk '{print $2}')
          echo "CoreDNS $version"
          git clone -q --depth 1 --branch "$version" https://github.com/coredns/coredns.git coredns

      - name: Add both plugins to plugin.cfg and build
        working-directory: coredns
        run: |
          set -euo pipefail
          go mod edit -replace github.com/jenting/zonedns="$GITHUB_WORKSPACE/zonedns"
          go mod edit -require github.com/jenting/zonedns@v0.0.0

          # Both must sort before cache, or the plugins themselves refuse to start.
          sed -i 's|^cache:cache$|zonedns:github.com/jenting/zonedns/plugin/zonedns\nzonedns_agent:github.com/jenting/zonedns/plugin/zonedns_agent\ncache:cache|' plugin.cfg
          grep -n -B2 '^cache:cache$' plugin.cfg

          # The order matters: go generate writes the import first, so that go mod
          # tidy does not drop the require.
          go generate
          go mod tidy
          go build -o coredns-zonedns .

      - name: Confirm both plugins registered
        working-directory: coredns
        run: |
          set -euo pipefail
          plugins=$(./coredns-zonedns -plugins)
          for p in zonedns zonedns_agent; do
            echo "$plugins" | grep -qx "$p" || { echo "$p did not register"; echo "$plugins"; exit 1; }
            echo "✓ $p"
          done

      # The ordering guard is one of this project's only two hard startup checks,
      # and it can be verified only on a real binary — the unit tests hand it a
      # synthetic Directives slice.
      - name: A wrong order must refuse to start
        working-directory: coredns
        run: |
          set -euo pipefail
          sed -i '/^zonedns:github.com\/jenting\/zonedns\/plugin\/zonedns$/d' plugin.cfg
          sed -i 's|^cache:cache$|cache:cache\nzonedns:github.com/jenting/zonedns/plugin/zonedns|' plugin.cfg
          go generate && go build -o coredns-wrongorder .

          cat > /tmp/Corefile <<'EOF'
          example.com:1053 {
              zonedns {
                  spire_server      unix:///tmp/nonexistent.sock
                  authorized_agent  spiffe://example.org/zone/infra/node/node-01
                  gateway           zone-a 203.0.113.10
              }
              cache 30
          }
          EOF
          if ./coredns-wrongorder -conf /tmp/Corefile -dns.port 1053 2>/tmp/err.log; then
            echo "a wrong order started successfully — the guard is not working"
            exit 1
          fi
          grep -q "must be ordered before cache" /tmp/err.log || {
            echo "it refused, but not with the expected message:"; cat /tmp/err.log; exit 1; }
          echo "✓ the wrong order was correctly refused"
          cat /tmp/err.log

  manifests:
    name: Kubernetes manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: zonedns-ci

      # Validating whether a ClusterSPIFFEID's fields really exist requires
      # spire-controller-manager's CRD — without it a mistyped field name sails
      # through as valid YAML.
      - name: Install the ClusterSPIFFEID CRD
        run: |
          curl -sSfL -o /tmp/csid-crd.yaml \
            https://raw.githubusercontent.com/spiffe/spire-controller-manager/main/config/crd/bases/spire.spiffe.io_clusterspiffeids.yaml
          kubectl apply -f /tmp/csid-crd.yaml
          kubectl wait --for=condition=Established --timeout=60s \
            crd/clusterspiffeids.spire.spiffe.io

      - name: server-side dry-run
        run: |
          set -euo pipefail
          for f in deploy/k8s/*.yaml; do
            echo "── $f"
            kubectl apply --dry-run=server -f "$f"
          done

  informer:
    name: Informer against a real cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Two nodes are required: a single node cannot prove the field selector
      # really scopes the informer to this machine.
      - name: Create a two-node kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: zonedns-informer
          config: deploy/kind/two-node.yaml

      # Use the repo's real RBAC rather than a more permissive copy — one of the
      # things this job checks is whether the permissions that manifest grants are
      # sufficient.
      - name: Apply the RBAC
        run: |
          kubectl apply -f deploy/k8s/01-rbac.yaml
          kubectl wait --for=condition=Ready node --all --timeout=180s

      # These tests sit behind a build tag and an ordinary go test ./... does not
      # reach them. They verify what fake.NewSimpleClientset structurally cannot:
      # that the field selector takes effect against a real API server, that the
      # RBAC suffices, and that a real informer's update events invalidate a pod
      # the moment it loses its eligibility to be indexed.
      - name: Run the cluster tests
        run: go test -tags=cluster ./internal/podzone/ -run TestCluster -v -count=1 -timeout 10m

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl auth can-i list pods \
            --as=system:serviceaccount:kube-system:node-local-dns || true

  drift:
    name: Drift check against a real cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create the kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: zonedns-drift

      # A real Istio CRD is essential: the unit tests' fake dynamic client validates
      # nothing about the GVR — a wrong group, a wrong resource plural, a wrong
      # version, and it lists happily all the same.
      - name: Install the Istio CRDs
        run: make istio-crds

      - name: Run the cluster tests
        run: make test-drift

      # This step checks the exit codes. The tool's whole value is blocking CI when
      # there is drift, and a check that always returns 0 is the same as no check at
      # all — so both directions have to be proven.
      - name: Verify the exit codes end to end
        run: |
          set -euo pipefail
          go build -o /tmp/zonedns-drift ./cmd/zonedns-drift
          kubectl create namespace drift-ci
          kubectl apply -n drift-ci -f - <<'EOF'
          apiVersion: networking.istio.io/v1
          kind: VirtualService
          metadata: {name: payments}
          spec:
            hosts: [payments.example.com, payments, payments.drift-ci.svc.cluster.local]
            http: [{route: [{destination: {host: payments}}]}]
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: payments-1
            labels: {zonedns.io/host: paymnets.example.com}
          spec:
            containers: [{name: pause, image: registry.k8s.io/pause:3.10}]
          EOF

          # The namespace must be scoped: this step asserts that the whole report is
          # clean once fixed, which is a global property that any leftover changes.
          # The previous step's cluster tests have just deleted their namespaces, and
          # namespace deletion is asynchronous — the pods inside linger in Terminating
          # and are still returned by a list. That is how this failed the first time
          # it ran on a runner.
          DRIFT="/tmp/zonedns-drift --namespace drift-ci"

          echo "── with drift present it should exit 1, and name names"
          set +e
          out=$($DRIFT --show-skipped); code=$?
          set -e
          echo "$out"
          [ "$code" = "1" ] || { echo "expected exit code 1, got $code"; exit 1; }
          # The exit code alone is not enough: a tool that always returns 1 would
          # pass too. Both directions of the drift must be named, or the report is an
          # alarm with nothing in it.
          grep -q "payments.example.com" <<<"$out" \
            || { echo "the unclaimed VirtualService host was not named"; exit 1; }
          grep -q "paymnets.example.com" <<<"$out" \
            || { echo "the unrouted pod label was not named"; exit 1; }

          echo "── once the label is fixed it should exit 0"
          kubectl label pod -n drift-ci payments-1 \
            zonedns.io/host=payments.example.com --overwrite
          $DRIFT

          echo "── with no Istio CRD it should exit 2, not report clean"
          kubectl delete crd virtualservices.networking.istio.io
          set +e
          $DRIFT; code=$?
          set -e
          [ "$code" = "2" ] || { echo "expected exit code 2, got $code"; exit 1; }

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get crd | grep -i istio || true
          kubectl get virtualservices -A -o yaml || true
          kubectl get pods -A --show-labels || true
