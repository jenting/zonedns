name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 與 go.mod 的 go 指令一致。這個版本不是隨意選的：它必須跟上游
  # sigs.k8s.io/node-local-dns 對得上，否則 agent plugin 連結不進去。
  GO_VERSION: "1.25"

jobs:
  test:
    name: 測試與靜態檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下檔案未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go mod tidy 應為 no-op
        run: |
          cp go.mod /tmp/go.mod.orig
          cp go.sum /tmp/go.sum.orig
          go mod tidy
          if ! diff -q go.mod /tmp/go.mod.orig >/dev/null || ! diff -q go.sum /tmp/go.sum.orig >/dev/null; then
            echo "go mod tidy 產生了差異，請在本機執行後提交："
            diff go.mod /tmp/go.mod.orig || true
            exit 1
          fi

      - name: go test
        run: go test ./... -race -cover

  plugin-link:
    name: 連結進 CoreDNS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zonedns
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # 這個 job 驗證的東西 go test ./... 完全碰不到：module 單獨編得過，
      # 不代表它能被 CoreDNS 的 plugin.cfg 連結進去。一個新的 import、一個
      # 版本衝突、或 plugin 註冊方式的改動，都只會在這裡失敗。
      - name: 取得 CoreDNS（版本與 go.mod 一致）
        run: |
          version=$(grep -oE 'github.com/coredns/coredns v[0-9.]+' zonedns/go.mod | head -1 | awk '{print $2}')
          echo "CoreDNS $version"
          git clone -q --depth 1 --branch "$version" https://github.com/coredns/coredns.git coredns

      - name: 把兩個 plugin 都加進 plugin.cfg 並建置
        working-directory: coredns
        run: |
          set -euo pipefail
          go mod edit -replace github.com/jenting/zonedns="$GITHUB_WORKSPACE/zonedns"
          go mod edit -require github.com/jenting/zonedns@v0.0.0

          # 兩者都必須排在 cache 之前，否則 plugin 自己會在啟動時拒絕啟動。
          sed -i 's|^cache:cache$|zonedns:github.com/jenting/zonedns/plugin/zonedns\nzonedns_agent:github.com/jenting/zonedns/plugin/zonedns_agent\ncache:cache|' plugin.cfg
          grep -n -B2 '^cache:cache$' plugin.cfg

          # 順序很重要：go generate 先寫出 import，go mod tidy 才不會把 require 清掉。
          go generate
          go mod tidy
          go build -o coredns-zonedns .

      - name: 確認兩個 plugin 都註冊了
        working-directory: coredns
        run: |
          set -euo pipefail
          plugins=$(./coredns-zonedns -plugins)
          for p in zonedns zonedns_agent; do
            echo "$plugins" | grep -qx "$p" || { echo "$p 未註冊"; echo "$plugins"; exit 1; }
            echo "✓ $p"
          done

      # 順序保護是本專案唯二的啟動期硬性檢查之一，而它只有在真實 binary 上
      # 才驗得到 —— 單元測試給的是合成的 Directives 切片。
      - name: 順序錯誤時必須拒絕啟動
        working-directory: coredns
        run: |
          set -euo pipefail
          sed -i '/^zonedns:github.com\/jenting\/zonedns\/plugin\/zonedns$/d' plugin.cfg
          sed -i 's|^cache:cache$|cache:cache\nzonedns:github.com/jenting/zonedns/plugin/zonedns|' plugin.cfg
          go generate && go build -o coredns-wrongorder .

          cat > /tmp/Corefile <<'EOF'
          example.com:1053 {
              zonedns {
                  spire_server      unix:///tmp/nonexistent.sock
                  authorized_agent  spiffe://example.org/zone/infra/node/node-01
                  gateway           zone-a 203.0.113.10
              }
              cache 30
          }
          EOF
          if ./coredns-wrongorder -conf /tmp/Corefile -dns.port 1053 2>/tmp/err.log; then
            echo "順序錯誤竟然啟動成功了 —— 保護失效"
            exit 1
          fi
          grep -q "must be ordered before cache" /tmp/err.log || {
            echo "拒絕了，但訊息不是預期的："; cat /tmp/err.log; exit 1; }
          echo "✓ 順序錯誤被正確拒絕"
          cat /tmp/err.log

  manifests:
    name: Kubernetes manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 建立 kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: zonedns-ci

      # ClusterSPIFFEID 需要 spire-controller-manager 的 CRD 才驗得到欄位是否
      # 真的存在 —— 少了它，一個打錯的欄位名會被當成合法 YAML 放過去。
      - name: 安裝 ClusterSPIFFEID CRD
        run: |
          curl -sSfL -o /tmp/csid-crd.yaml \
            https://raw.githubusercontent.com/spiffe/spire-controller-manager/main/config/crd/bases/spire.spiffe.io_clusterspiffeids.yaml
          kubectl apply -f /tmp/csid-crd.yaml
          kubectl wait --for=condition=Established --timeout=60s \
            crd/clusterspiffeids.spire.spiffe.io

      - name: server-side dry-run
        run: |
          set -euo pipefail
          for f in deploy/k8s/*.yaml; do
            echo "── $f"
            kubectl apply --dry-run=server -f "$f"
          done

  informer:
    name: informer 對真實 cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 必須是兩個節點：單節點無法證明 field selector 真的把範圍限縮到本機。
      - name: 建立兩節點 kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: zonedns-informer
          config: deploy/kind/two-node.yaml

      # 用 repo 裡真正的 RBAC，不是另外寫一份寬鬆的 —— 這個 job 要驗的其中
      # 一件事就是那份 manifest 給的權限夠不夠。
      - name: 套用 RBAC
        run: |
          kubectl apply -f deploy/k8s/01-rbac.yaml
          kubectl wait --for=condition=Ready node --all --timeout=180s

      # 這些測試以 build tag 隔開，一般的 go test ./... 不會跑到。它們驗的是
      # fake.NewSimpleClientset 結構上做不到的事：field selector 對真實 API
      # server 生效、RBAC 足夠、以及真實 informer 的 update 事件會立即讓失去
      # 索引資格的 pod 失效。
      - name: 執行 cluster 測試
        run: go test -tags=cluster ./internal/podzone/ -run TestCluster -v -count=1 -timeout 10m

      - name: 失敗時傾印 cluster 狀態
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl auth can-i list pods \
            --as=system:serviceaccount:kube-system:node-local-dns || true

  drift:
    name: 漂移檢查對真實 cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 建立 kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: zonedns-drift

      # 一定要用真的 Istio CRD：單元測試的 fake dynamic client 對 GVR 不做任何
      # 驗證 —— 群組名、資源複數形、版本全部打錯，它一樣照列不誤。
      - name: 安裝 Istio CRD
        run: make istio-crds

      - name: 執行 cluster 測試
        run: make test-drift

      # 這一段驗的是離開碼。工具的價值全在「有漂移時擋下 CI」，而一支永遠回 0
      # 的檢查跟沒有檢查完全一樣 —— 所以兩個方向都要證明。
      - name: 端對端驗證離開碼
        run: |
          set -euo pipefail
          go build -o /tmp/zonedns-drift ./cmd/zonedns-drift
          kubectl create namespace drift-ci
          kubectl apply -n drift-ci -f - <<'EOF'
          apiVersion: networking.istio.io/v1
          kind: VirtualService
          metadata: {name: payments}
          spec:
            hosts: [payments.example.com, payments, payments.drift-ci.svc.cluster.local]
            http: [{route: [{destination: {host: payments}}]}]
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: payments-1
            labels: {zonedns.io/host: paymnets.example.com}
          spec:
            containers: [{name: pause, image: registry.k8s.io/pause:3.10}]
          EOF

          echo "── 有漂移時應離開 1，而且要指名道姓"
          set +e
          out=$(/tmp/zonedns-drift --show-skipped); code=$?
          set -e
          echo "$out"
          [ "$code" = "1" ] || { echo "預期離開碼 1，實得 $code"; exit 1; }
          # 只驗離開碼不夠：一支永遠回 1 的工具也會通過。漂移的兩個方向都必須
          # 被點名，否則報告等於一個沒有內容的警報。
          grep -q "payments.example.com" <<<"$out" \
            || { echo "沒有點名無人認領的 VirtualService host"; exit 1; }
          grep -q "paymnets.example.com" <<<"$out" \
            || { echo "沒有點名沒有路由的 pod label"; exit 1; }

          echo "── 修好 label 後應離開 0"
          kubectl label pod -n drift-ci payments-1 \
            zonedns.io/host=payments.example.com --overwrite
          /tmp/zonedns-drift

          echo "── 沒有 Istio CRD 時應離開 2，而不是回報乾淨"
          kubectl delete crd virtualservices.networking.istio.io
          set +e
          /tmp/zonedns-drift; code=$?
          set -e
          [ "$code" = "2" ] || { echo "預期離開碼 2，實得 $code"; exit 1; }

      - name: 失敗時傾印 cluster 狀態
        if: failure()
        run: |
          kubectl get crd | grep -i istio || true
          kubectl get virtualservices -A -o yaml || true
          kubectl get pods -A --show-labels || true
